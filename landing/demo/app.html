<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rekalla demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --base: #000000;
    --elev1: #1c1c1e;
    --elev2: #2c2c2e;
    --elev3: #3a3a3c;
    --label: #ffffff;
    --label2: #d1d1d6;
    --label3: #8e8e93;
    --label4: #636366;
    --green: #30d158;
    --blue: #0a84ff;
    --teal: #64d2ff;
    --orange: #ff9f0a;
    --pink: #ff375f;
    --purple: #bf5af2;
    --yellow: #ffd60a;
    --red: #ff453a;
  }
  html, body { height: 100%; }
  body {
    background: var(--base);
    color: var(--label);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .app { display: flex; flex-direction: column; height: 100%; }

  /* status bar */
  .statusbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 22px 4px; font-size: 13px; font-weight: 600; color: var(--label);
    flex: 0 0 auto;
  }
  .statusbar .icons { display: flex; gap: 6px; align-items: center; }
  .statusbar svg { display: block; }

  /* scrollable screen area */
  .screen {
    flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 6px 18px 24px;
  }
  .screen::-webkit-scrollbar { width: 0; }

  .head { display: flex; align-items: flex-start; justify-content: space-between; margin: 8px 0 18px; }
  .kicker { font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: var(--label3); text-transform: uppercase; }
  .greeting { font-size: 27px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.1; margin-top: 4px; }
  .h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.6px; margin-bottom: 4px; }
  .lede { color: var(--label3); font-size: 15px; margin-bottom: 20px; }
  .head-actions { display: flex; gap: 6px; padding-top: 6px; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 999px; border: 0; cursor: pointer;
    background: transparent; color: var(--label2); display: grid; place-items: center;
  }
  .icon-btn:active { background: var(--elev1); }

  .card { background: var(--elev1); border-radius: 22px; padding: 18px; margin-bottom: 14px; }
  .section-title { font-size: 22px; font-weight: 800; letter-spacing: -0.4px; margin: 14px 2px 12px; }

  /* rings card */
  .rings-card { display: flex; align-items: center; gap: 8px; padding: 20px 18px; }
  .rings { flex: 0 0 auto; }
  .legend { display: flex; flex-direction: column; gap: 14px; margin-left: 6px; }
  .leg-row .leg-top { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; color: var(--label3); text-transform: uppercase; }
  .dot { width: 9px; height: 9px; border-radius: 999px; }
  .leg-val { font-size: 21px; font-weight: 800; letter-spacing: -0.3px; margin-top: 1px; }

  /* reminder / list rows */
  .row { display: flex; align-items: center; gap: 13px; }
  .tile { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; font-size: 20px; flex: 0 0 auto; }
  .row-main { flex: 1 1 auto; min-width: 0; }
  .row-title { font-size: 17px; font-weight: 700; letter-spacing: -0.2px; }
  .row-sub { color: var(--label3); font-size: 14px; margin-top: 1px; }

  .btn-row { display: flex; gap: 10px; margin-top: 14px; }
  .btn {
    flex: 1 1 0; min-height: 46px; border: 0; border-radius: 14px; cursor: pointer;
    font-family: inherit; font-size: 16px; font-weight: 700; letter-spacing: -0.2px;
    display: grid; place-items: center; transition: opacity .12s, transform .05s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-done { background: var(--label); color: #000; }
  .btn-snooze { background: var(--elev2); color: var(--label); }
  .btn-ghost { background: var(--elev2); color: var(--label2); }

  .done-badge {
    display: inline-flex; align-items: center; gap: 7px; margin-top: 12px;
    color: var(--green); font-size: 15px; font-weight: 700;
  }
  .snoozed-badge { color: var(--orange); }
  .link-btn { background: none; border: 0; color: var(--label3); font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; padding: 4px 0; }

  .completed .row-title { color: var(--label3); text-decoration: line-through; }

  /* checkbox rows (routine) */
  .check-row { display: flex; align-items: center; gap: 14px; background: var(--elev1); border-radius: 20px; padding: 14px 16px; margin-bottom: 12px; cursor: pointer; }
  .check-row:active { background: var(--elev2); }
  .checkbox {
    width: 40px; height: 40px; border-radius: 12px; flex: 0 0 auto;
    border: 2px solid var(--elev3); display: grid; place-items: center; transition: all .12s;
  }
  .checkbox.on { background: var(--label); border-color: var(--label); }
  .checkbox svg { opacity: 0; transition: opacity .12s; }
  .checkbox.on svg { opacity: 1; }
  .check-title { font-size: 17px; font-weight: 700; letter-spacing: -0.2px; }
  .check-sub { color: var(--label3); font-size: 14px; margin-top: 1px; }
  .check-row.on .check-title { color: var(--label3); text-decoration: line-through; }

  /* search */
  .search {
    width: 100%; background: var(--elev1); border: 0; border-radius: 15px;
    padding: 14px 16px; color: var(--label); font-size: 16px; font-family: inherit; margin-bottom: 16px;
  }
  .search::placeholder { color: var(--label3); }
  .search:focus { outline: 2px solid var(--elev3); }

  .vault-card { background: var(--elev1); border-radius: 20px; padding: 16px; margin-bottom: 12px; }
  .vault-phone {
    display: flex; align-items: center; gap: 9px; margin-top: 12px;
    background: rgba(48,209,88,0.14); color: var(--green); border-radius: 13px;
    padding: 12px 14px; font-size: 16px; font-weight: 700; border: 0; width: 100%; cursor: pointer; font-family: inherit;
  }
  .vault-phone:active { background: rgba(48,209,88,0.24); }
  .star { color: var(--label); font-size: 15px; }
  .empty { color: var(--label3); text-align: center; padding: 40px 0; font-size: 15px; }

  /* wellness */
  .well-label { font-size: 15px; font-weight: 700; color: var(--label2); margin: 4px 2px 10px; }
  .mood-row { display: flex; gap: 8px; margin-bottom: 22px; }
  .mood {
    flex: 1 1 0; aspect-ratio: 1; border: 2px solid var(--elev2); background: var(--elev1);
    border-radius: 16px; font-size: 24px; cursor: pointer; display: grid; place-items: center; transition: all .12s;
  }
  .mood:active { transform: scale(0.95); }
  .mood.on { border-color: var(--label); background: var(--elev2); transform: scale(1.03); }
  .well-done { text-align: center; padding: 14px 0; }
  .well-done .big { font-size: 44px; }

  /* tab bar */
  .tabbar {
    flex: 0 0 auto; display: flex; border-top: 1px solid rgba(255,255,255,0.09);
    background: rgba(0,0,0,0.9); padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .tab {
    flex: 1 1 0; background: none; border: 0; cursor: pointer; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0;
    color: var(--label4); transition: color .12s;
  }
  .tab .label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.1px; }
  .tab.on { color: var(--label); }
  .tab svg { display: block; }

  .toast {
    position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%) translateY(12px);
    background: var(--elev3); color: var(--label); padding: 11px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .22s;
    white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---- caregiver side ---- */
  .topbar { flex: 0 0 auto; display: flex; align-items: center; min-height: 46px; padding: 0 10px; position: relative; }
  .topbar .title { position: absolute; left: 0; right: 0; text-align: center; font-size: 18px; font-weight: 700; letter-spacing: -0.3px; pointer-events: none; }
  .back { background: none; border: 0; color: var(--label); cursor: pointer; display: flex; align-items: center; gap: 2px; font-family: inherit; font-size: 16px; font-weight: 600; padding: 8px 6px; position: relative; z-index: 1; }
  .seg { display: flex; background: var(--elev1); border-radius: 14px; padding: 4px; margin-bottom: 16px; }
  .seg button { flex: 1 1 0; min-height: 40px; border: 0; border-radius: 11px; background: none; color: var(--label3); font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; padding: 0 4px; }
  .seg button.on { background: var(--elev3); color: var(--label); }
  .summary-line { color: var(--label2); font-size: 15px; margin: 0 2px 14px; }
  .btn-block { width: 100%; margin-bottom: 14px; }
  .field-label { font-size: 14px; font-weight: 700; color: var(--label2); margin: 14px 0 8px; }
  .field-label:first-child { margin-top: 0; }
  .input {
    width: 100%; min-height: 48px; background: var(--elev2); border: 0; border-radius: 13px;
    padding: 0 14px; color: var(--label); font-size: 16px; font-family: inherit; color-scheme: dark;
  }
  .input::placeholder { color: var(--label4); }
  .input:focus { outline: 2px solid var(--label3); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { min-height: 38px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--elev2); color: var(--label2); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .chip.on { background: var(--label); color: #000; }
  .form-error { color: var(--red); font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .mrow { display: flex; align-items: center; gap: 12px; background: var(--elev1); border-radius: 18px; padding: 13px 14px; margin-bottom: 10px; }
  .mrow .row-title { font-size: 16px; }
  .status { flex: 0 0 auto; font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: var(--elev2); color: var(--label3); }
  .status.done { background: rgba(48,209,88,0.16); color: var(--green); }
  .status.snoozed { background: rgba(255,159,10,0.16); color: var(--orange); }
  .del { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--elev2); color: var(--label3); cursor: pointer; display: grid; place-items: center; }
  .del:active { color: var(--red); }
  .person-row { display: flex; align-items: center; gap: 14px; background: var(--elev1); border-radius: 22px; padding: 16px; cursor: pointer; border: 0; width: 100%; text-align: left; font-family: inherit; color: inherit; }
  .person-row:active { background: var(--elev2); }
  .avatar { width: 52px; height: 52px; border-radius: 18px; background: rgba(191,90,242,0.2); color: var(--purple); display: grid; place-items: center; font-size: 18px; font-weight: 600; flex: 0 0 auto; }
  .card-title { font-size: 19px; font-weight: 700; letter-spacing: -0.3px; }
  .card-body { color: var(--label3); font-size: 15px; margin: 6px 0 14px; }
  .code-input { text-align: center; letter-spacing: 6px; font-size: 19px; font-weight: 600; min-height: 54px; margin-bottom: 12px; text-transform: uppercase; }
  .msg-ok { color: var(--green); font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  .chev { color: var(--label4); flex: 0 0 auto; }

  /* something the other phone just changed */
  @keyframes flash { 0% { box-shadow: 0 0 0 2px #fff; } 100% { box-shadow: 0 0 0 2px rgba(255,255,255,0); } }
  .flash { animation: flash 2.4s ease-out 1; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="statusbar">
    <span id="clock">9:41</span>
    <span class="icons" aria-hidden="true">
      <!-- signal -->
      <svg width="18" height="12" viewBox="0 0 18 12"><g fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></g></svg>
      <!-- battery -->
      <svg width="26" height="13" viewBox="0 0 26 13"><rect x="0.5" y="0.5" width="21" height="12" rx="3.5" fill="none" stroke="#fff" stroke-opacity="0.5"/><rect x="2.5" y="2.5" width="16" height="8" rx="1.8" fill="#fff"/><rect x="23" y="4" width="2" height="5" rx="1" fill="#fff" fill-opacity="0.5"/></svg>
    </span>
  </div>

  <div class="topbar" id="topbar" hidden></div>

  <div class="screen" id="screen"></div>

  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  // One file, two phones. ?role=caregiver shows the caregiver's app, anything
  // else shows the loved one's. The landing page loads both side by side and
  // they share their sample data over a BroadcastChannel, so a reminder added
  // on one phone appears on the other. Nothing leaves the browser.
  var ROLE = /[?&]role=caregiver\b/.test(location.search) ? "caregiver" : "patient";
  var PATIENT = { full: "Rosa Martinez", first: "Rosa", initials: "RM" };
  var CAREGIVER = { full: "Sarah Martinez", first: "Sarah" };

  var REM_CATS = [
    { value: "medication", label: "Medication", icon: "💊", tint: "#ff453a" },
    { value: "meals", label: "Meals", icon: "🍽️", tint: "#ff9f0a" },
    { value: "appointments", label: "Appointments", icon: "📅", tint: "#0a84ff" },
    { value: "exercise", label: "Exercise", icon: "🚶", tint: "#30d158" },
    { value: "family_calls", label: "Family calls", icon: "📞", tint: "#bf5af2" },
    { value: "custom", label: "Personal", icon: "⭐", tint: "#ffd60a" }
  ];
  var FREQS = [
    { value: "daily", label: "Every day" },
    { value: "once", label: "Just once" },
    { value: "weekly", label: "Weekly" }
  ];
  var PERIODS = [
    { value: "Morning", label: "Morning" },
    { value: "Afternoon", label: "Afternoon" },
    { value: "Evening", label: "Evening" }
  ];
  var VAULT_KINDS = [
    { value: "family", label: "Family", icon: "👥", tint: "#bf5af2" },
    { value: "contact", label: "Contact", icon: "👤", tint: "#64d2ff" },
    { value: "doctor", label: "Doctor", icon: "⚕️", tint: "#0a84ff" },
    { value: "medication", label: "Medication", icon: "💊", tint: "#ff453a" },
    { value: "important_date", label: "Important date", icon: "📅", tint: "#ffd60a" },
    { value: "emergency", label: "Emergency", icon: "❗", tint: "#ff453a" },
    { value: "note", label: "Note", icon: "📝", tint: "#ff9f0a" }
  ];
  function byValue(list, v) { return list.filter(function (o) { return o.value === v; })[0] || list[list.length - 1]; }

  // ---- data both phones share --------------------------------------------
  var shared = {
    reminders: [
      { id: "r1", title: "Morning pills", time: "08:00", cat: "medication", freq: "daily", status: "done" },
      { id: "r2", title: "Water the plants", time: "09:00", cat: "custom", freq: "daily", icon: "🪴", tint: "#30d158", status: "done" },
      { id: "r3", title: "Lunch", time: "12:30", cat: "meals", freq: "daily", status: "done" },
      { id: "r4", title: "Call Sarah", time: "21:30", cat: "family_calls", freq: "daily", status: "open" }
    ],
    routine: [
      { id: "m1", period: "Morning", title: "Brush teeth", time: "08:00", done: true },
      { id: "m2", period: "Morning", title: "Water the plants", time: "09:00", done: true },
      { id: "a1", period: "Afternoon", title: "Short walk outside", time: "14:00", done: true },
      { id: "e1", period: "Evening", title: "Take evening pills", time: "20:00", done: false }
    ],
    vault: [
      { id: "v1", kind: "family", title: "Sarah (daughter)", sub: "Lives 10 minutes away", star: true, phone: "(555) 987-6543" },
      { id: "v2", kind: "doctor", title: "Dr. Alvarez", sub: "Primary care · Tuesdays", star: true, phone: "(555) 123-4567" },
      { id: "v3", kind: "medication", title: "Metformin", sub: "500mg with breakfast and dinner" },
      { id: "v4", kind: "important_date", title: "Wedding anniversary", sub: "June 12th" },
      { id: "v5", kind: "emergency", title: "Emergency contact", sub: "Sarah, then Dr. Alvarez" }
    ],
    checkin: null // {mood: 0-4}
  };

  // ---- what only this phone knows ----------------------------------------
  var state = { tab: "summary", vaultQuery: "" };
  var cg = { view: "people", seg: "reminders", formOpen: false, error: "", code: "", codeMsg: "", form: null };
  function blankForm() {
    return { title: "", cat: "medication", time: "09:00", freq: "daily", period: "Morning", stepTime: "", kind: "family", name: "", desc: "", phone: "" };
  }
  cg.form = blankForm();

  var MOODS = ["😞", "😕", "🙂", "😊", "😄"];

  // ---- derived -----------------------------------------------------------
  function sortedReminders() {
    return shared.reminders.slice().sort(function (a, b) { return a.time < b.time ? -1 : a.time > b.time ? 1 : 0; });
  }
  function remindersDone() { return shared.reminders.filter(function (r) { return r.status === "done"; }).length; }
  function routineDone() { return shared.routine.filter(function (r) { return r.done; }).length; }
  function nextReminder() { return sortedReminders().filter(function (r) { return r.status !== "done"; })[0] || null; }
  function fmtTime(t) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(t || "");
    if (!m) return "";
    var h = parseInt(m[1], 10), ap = h >= 12 ? "PM" : "AM";
    h = h % 12; if (h === 0) h = 12;
    return h + ":" + m[2] + " " + ap;
  }
  function remLook(r) { var c = byValue(REM_CATS, r.cat); return { icon: r.icon || c.icon, tint: r.tint || c.tint, label: c.label }; }
  function vaultLook(v) { return byValue(VAULT_KINDS, v.kind); }
  function scheduleText(r) {
    if (r.freq === "once") return "Today at " + fmtTime(r.time);
    if (r.freq === "weekly") return "Every week at " + fmtTime(r.time);
    return "Every day at " + fmtTime(r.time);
  }

  // ---- keeping the two phones in step ------------------------------------
  var chan = null, dirty = false, flashId = null;
  try { chan = new BroadcastChannel("rekalla-demo"); } catch (e) { chan = null; }
  function publish(flash) {
    dirty = true;
    if (chan) chan.postMessage({ type: "state", shared: shared, flash: flash || null });
  }
  if (chan) {
    chan.onmessage = function (ev) {
      var m = ev.data || {};
      if (m.type === "hello") { if (dirty) publish(); return; }
      if (m.type !== "state") return;
      shared = m.shared;
      dirty = true;
      flashId = m.flash;
      refresh();
    };
    chan.postMessage({ type: "hello" });
  }
  var idCount = 0;
  function newId() { idCount += 1; return ROLE.charAt(0) + Date.now().toString(36) + idCount; }

  // ---- icons -------------------------------------------------------------
  var ICONS = {
    heart: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1l1.7 1.7L12 21.4l7.1-7.1 1.7-1.7a5 5 0 0 0 0-7z"/></svg>',
    gear: '<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>',
    check: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    checkGreen: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    clock: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',

    wellness: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1l1.7 1.7L12 21.4l7.1-7.1 1.7-1.7a5 5 0 0 0 0-7z"/></svg>'
  };

  ICONS.chevL = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>';
  ICONS.chevR = '<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>';
  ICONS.trash = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
  TAB_ICONS.people = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.6"/><path d="M17 14.2a5.2 5.2 0 0 1 4.6 5.3"/></svg>';
  TAB_ICONS.account = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>';

  var TABS = ROLE === "caregiver"
    ? [{ id: "people", label: "People" }, { id: "account", label: "Account" }]
    : [
      { id: "summary", label: "Summary" },
      { id: "reminders", label: "Reminders" },
      { id: "routine", label: "Routine" },
      { id: "vault", label: "Vault" },
      { id: "wellness", label: "Wellness" }
    ];

  // ---- helpers -----------------------------------------------------------
  var screen = document.getElementById("screen");
  var topbar = document.getElementById("topbar");
  var tabbar = document.getElementById("tabbar");
  var toastEl = document.getElementById("toast");
  var toastTimer;

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1600);
  }

  function ring(cx, cy, r, w, color, frac) {
    var c = 2 * Math.PI * r;
    var off = c * (1 - Math.max(0, Math.min(1, frac)));
    return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-opacity="0.22" stroke-width="' + w + '"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + w + '" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>';
  }
  function tile(look) {
    return '<div class="tile" style="background:' + look.tint + '1f;color:' + look.tint + '">' + look.icon + '</div>';
  }

  // ---- loved one's screens -----------------------------------------------
  function renderSummary() {
    var rDone = remindersDone(), rTot = shared.reminders.length;
    var oDone = routineDone(), oTot = shared.routine.length;
    var checkedIn = shared.checkin != null;
    var nxt = nextReminder();

    var svg = '<svg class="rings" width="140" height="140" viewBox="0 0 140 140" aria-hidden="true">' +
      ring(70, 70, 56, 15, "var(--pink)", rTot ? rDone / rTot : 0) +
      ring(70, 70, 39, 15, "var(--green)", oTot ? oDone / oTot : 0) +
      ring(70, 70, 22, 15, "var(--blue)", checkedIn ? 1 : 0) +
      '</svg>';

    var upNext;
    if (nxt) {
      var look = remLook(nxt);
      upNext = '<div class="card" data-item="' + nxt.id + '">' +
          '<div class="row">' + tile(look) +
            '<div class="row-main"><div class="row-title">' + esc(nxt.title) + '</div>' +
            '<div class="row-sub">' + fmtTime(nxt.time) + ' · ' + look.label + '</div></div>' +
          '</div>' +
          '<div class="btn-row">' +
            '<button class="btn btn-done" data-act="done" data-id="' + nxt.id + '">Done</button>' +
            '<button class="btn btn-snooze" data-act="snooze" data-id="' + nxt.id + '">Snooze</button>' +
          '</div>' +
        '</div>';
    } else if (rTot) {
      upNext = '<div class="card"><div class="done-badge">' + ICONS.checkGreen + ' All reminders done for today</div></div>';
    } else {
      upNext = '<div class="card"><div class="row-sub">No reminders scheduled for today.</div></div>';
    }

    screen.innerHTML =
      '<div class="head">' +
        '<div><div class="kicker">' + todayLabel() + '</div>' +
        '<div class="greeting">' + greetingWord() + ',<br>' + PATIENT.first + '</div></div>' +
        '<div class="head-actions">' +
          '<button class="icon-btn" data-toast="Saved to favorites" aria-label="Favorites">' + ICONS.heart + '</button>' +
          '<button class="icon-btn" data-toast="Settings" aria-label="Settings">' + ICONS.gear + '</button>' +
        '</div>' +
      '</div>' +
      '<div class="card rings-card">' + svg +
        '<div class="legend">' +
          legRow("var(--pink)", "Reminders", rTot ? rDone + " of " + rTot : "None today") +
          legRow("var(--green)", "Routine", oTot ? oDone + " of " + oTot : "Not set up") +
          legRow("var(--blue)", "Check-in", checkedIn ? "Done" : "Not yet") +
        '</div>' +
      '</div>' +
      '<div class="section-title">Up next</div>' +
      upNext;
  }

  function legRow(color, label, val) {
    var muted = val === "Not yet" || val === "None today" || val === "Not set up";
    return '<div class="leg-row"><div class="leg-top"><span class="dot" style="background:' + color + '"></span>' + label + '</div>' +
      '<div class="leg-val" style="color:' + (muted ? "var(--label3)" : color) + '">' + val + '</div></div>';
  }

  function renderReminders() {
    var html = '<div class="h1">Reminders</div><div class="lede">Tap Done when you’ve finished, or Snooze for later.</div>';
    var list = sortedReminders();
    if (!list.length) html += '<div class="empty">No reminders scheduled for today.</div>';
    list.forEach(function (r) {
      var done = r.status === "done", snoozed = r.status === "snoozed", look = remLook(r);
      html += '<div class="card' + (done ? " completed" : "") + '" data-item="' + r.id + '">' +
        '<div class="row">' + tile(look) +
          '<div class="row-main"><div class="row-title">' + esc(r.title) + '</div>' +
          '<div class="row-sub">' + fmtTime(r.time) + ' · ' + look.label + '</div></div>' +
        '</div>';
      if (done) {
        html += '<div class="done-badge">' + ICONS.checkGreen + ' Done ' +
          '<button class="link-btn" data-act="reopen" data-id="' + r.id + '">Undo</button></div>';
      } else if (snoozed) {
        html += '<div class="done-badge snoozed-badge">' + ICONS.clock + ' Snoozed 10 min ' +
          '<button class="link-btn" data-act="done" data-id="' + r.id + '">Mark done</button></div>';
      } else {
        html += '<div class="btn-row">' +
          '<button class="btn btn-done" data-act="done" data-id="' + r.id + '">Done</button>' +
          '<button class="btn btn-snooze" data-act="snooze" data-id="' + r.id + '">Snooze</button>' +
        '</div>';
      }
      html += '</div>';
    });
    screen.innerHTML = html;
  }

  function renderRoutine() {
    var html = '<div class="h1">Routine</div><div class="lede">Check off each step as your day goes on.</div>';
    if (!shared.routine.length) html += '<div class="empty">No routine set up yet.</div>';
    PERIODS.forEach(function (p) {
      var items = shared.routine.filter(function (i) { return i.period === p.value; });
      if (!items.length) return;
      html += '<div class="section-title">' + p.label + '</div>';
      items.forEach(function (i) {
        html += '<div class="check-row' + (i.done ? " on" : "") + '" data-act="toggle" data-id="' + i.id + '" data-item="' + i.id + '" role="button" tabindex="0">' +
          '<div class="checkbox' + (i.done ? " on" : "") + '">' + ICONS.check + '</div>' +
          '<div><div class="check-title">' + esc(i.title) + '</div>' +
          '<div class="check-sub">' + (i.time ? "around " + fmtTime(i.time) : "any time") + '</div></div>' +
        '</div>';
      });
    });
    screen.innerHTML = html;
  }

  function renderVault() {
    var q = state.vaultQuery.trim().toLowerCase();
    var items = shared.vault.filter(function (v) {
      return !q || (v.title + " " + (v.sub || "")).toLowerCase().indexOf(q) !== -1;
    });
    var list = items.map(function (v) {
      return '<div class="vault-card" data-item="' + v.id + '">' +
        '<div class="row">' + tile(vaultLook(v)) +
          '<div class="row-main"><div class="row-title">' + esc(v.title) + (v.star ? ' <span class="star">★</span>' : '') + '</div>' +
          (v.sub ? '<div class="row-sub">' + esc(v.sub) + '</div>' : '') + '</div>' +
        '</div>' +
        (v.phone ? '<button class="vault-phone" data-toast="Calling ' + esc(v.phone) + '">' + ICONS.phone + esc(v.phone) + '</button>' : '') +
      '</div>';
    }).join("");
    screen.innerHTML =
      '<div class="h1">Vault</div>' +
      '<div class="lede">People, doctors, and important details — kept up to date by your caregiver.</div>' +
      '<input class="search" id="vault-search" type="text" placeholder="Search names, medications, notes…" value="' + esc(state.vaultQuery) + '">' +
      (list || '<div class="empty">' + (q ? 'Nothing matches “' + esc(state.vaultQuery) + '”.' : 'Nothing saved yet.') + '</div>');
    var s = document.getElementById("vault-search");
    if (s) {
      s.addEventListener("input", function () { state.vaultQuery = s.value; renderVault(); });
      if (q) { s.focus(); var v = s.value; s.value = ""; s.value = v; }
    }
  }

  function renderWellness() {
    var html = '<div class="h1">Daily check-in</div><div class="lede">A quick note on how today feels.</div>';
    if (shared.checkin != null) {
      html += '<div class="card well-done">' +
        '<div class="big">' + MOODS[shared.checkin.mood] + '</div>' +
        '<div class="done-badge" style="justify-content:center">' + ICONS.checkGreen + ' Checked in for today</div>' +
        '<button class="btn btn-ghost" style="margin-top:16px;width:100%" data-act="edit-checkin">Change my answer</button>' +
      '</div>';
    } else {
      html += '<div class="well-label">How are you feeling today?</div><div class="mood-row">';
      MOODS.forEach(function (m, i) {
        html += '<button class="mood" data-act="mood" data-mood="' + i + '" aria-label="Mood ' + (i + 1) + ' of 5">' + m + '</button>';
      });
      html += '</div>' +
        '<button class="btn btn-done" id="save-checkin" style="width:100%;opacity:.5;pointer-events:none">Save today’s check-in</button>';
    }
    screen.innerHTML = html;
  }

  var pendingMood = null;

  // ---- caregiver's screens -----------------------------------------------
  function chips(name, options, value) {
    return '<div class="chips">' + options.map(function (o) {
      return '<button type="button" class="chip' + (o.value === value ? " on" : "") + '" data-chip="' + name + '" data-value="' + o.value + '" aria-pressed="' + (o.value === value) + '">' + o.label + '</button>';
    }).join("") + '</div>';
  }
  function field(label, name, placeholder, type) {
    return '<div class="field-label">' + label + '</div>' +
      '<input class="input" data-field="' + name + '" type="' + (type || "text") + '" placeholder="' + esc(placeholder || "") + '" value="' + esc(cg.form[name]) + '">';
  }
  function delBtn(kind, id, title) {
    return '<button class="del" data-act="del-' + kind + '" data-id="' + id + '" aria-label="Delete ' + esc(title) + '">' + ICONS.trash + '</button>';
  }

  function renderPeople() {
    topbar.innerHTML = '<div class="title">People</div>';
    screen.innerHTML =
      '<div class="lede" style="margin-top:6px">Everyone you help care for, in one place.</div>' +
      '<div class="card">' +
        '<div class="card-title">Connect to someone</div>' +
        '<div class="card-body">Ask them to read you the six-character code from their app. They approve the request on their own phone.</div>' +
        (cg.codeMsg ? '<div class="msg-ok">' + esc(cg.codeMsg) + '</div>' : '') +
        '<input class="input code-input" id="code" maxlength="6" placeholder="R7K2QX" aria-label="Connect code" value="' + esc(cg.code) + '">' +
        '<button class="btn btn-done btn-block" style="margin-bottom:0" data-act="connect">Connect</button>' +
      '</div>' +
      '<div class="section-title">People I care for</div>' +
      '<button class="person-row" data-act="open-patient">' +
        '<div class="avatar">' + PATIENT.initials + '</div>' +
        '<div class="row-main"><div class="row-title">' + PATIENT.full + '</div>' +
        '<div class="row-sub">Reminders, routine &amp; memory bank</div></div>' + ICONS.chevR +
      '</button>';
  }

  function renderAccount() {
    topbar.innerHTML = '<div class="title">Account</div>';
    screen.innerHTML =
      '<div class="card" style="margin-top:8px"><div class="row">' +
        '<div class="avatar" style="background:rgba(10,132,255,0.2);color:var(--blue)">SM</div>' +
        '<div class="row-main"><div class="row-title">' + CAREGIVER.full + '</div><div class="row-sub">Caregiver account</div></div>' +
      '</div></div>' +
      '<div class="card"><div class="row-title">Language</div><div class="row-sub">English · Español</div></div>' +
      '<button class="btn btn-ghost btn-block" data-toast="Sign out is switched off in this preview">Sign out</button>';
  }

  function formHtml() {
    if (!cg.formOpen) return "";
    var err = cg.error ? '<div class="form-error">' + esc(cg.error) + '</div>' : "";
    if (cg.seg === "reminders") {
      return '<div class="card">' + err +
        field("What should we remind " + PATIENT.first + " about?", "title", "e.g. Call the dentist") +
        '<div class="field-label">Category</div>' + chips("cat", REM_CATS, cg.form.cat) +
        field("At what time?", "time", "", "time") +
        '<div class="field-label">How often?</div>' + chips("freq", FREQS, cg.form.freq) +
        '<button class="btn btn-done btn-block" style="margin:18px 0 0" data-act="save">Add reminder</button></div>';
    }
    if (cg.seg === "routine") {
      return '<div class="card">' + err +
        field("What’s the step?", "title", "e.g. Brush teeth") +
        '<div class="field-label">Time of day</div>' + chips("period", PERIODS, cg.form.period) +
        field("Around what time? (optional)", "stepTime", "", "time") +
        '<button class="btn btn-done btn-block" style="margin:18px 0 0" data-act="save">Add step</button></div>';
    }
    return '<div class="card">' + err +
      '<div class="field-label">What kind of thing is this?</div>' + chips("kind", VAULT_KINDS, cg.form.kind) +
      field("Name", "name", "e.g. Dr. Alvarez, or Sarah (daughter)") +
      field("Short description (optional)", "desc", "e.g. Primary care doctor") +
      field("Phone number (optional)", "phone", "e.g. (555) 123-4567", "tel") +
      '<button class="btn btn-done btn-block" style="margin:18px 0 0" data-act="save">Save to memory bank</button></div>';
  }

  function listsHtml() {
    var html = "";
    if (cg.seg === "reminders") {
      var list = sortedReminders();
      html += '<div class="section-title">Today</div>';
      if (!list.length) html += '<div class="empty">Nothing scheduled for ' + PATIENT.first + ' today.</div>';
      list.forEach(function (r) {
        var look = remLook(r);
        var st = r.status === "done" ? ["done", "Done"] : r.status === "snoozed" ? ["snoozed", "Snoozed"] : ["", "Not yet"];
        html += '<div class="mrow" data-item="' + r.id + '">' + tile(look) +
          '<div class="row-main"><div class="row-title">' + esc(r.title) + '</div>' +
          '<div class="row-sub">' + fmtTime(r.time) + ' · ' + look.label + '</div></div>' +
          '<span class="status ' + st[0] + '">' + st[1] + '</span></div>';
      });
      html += '<div class="section-title">All reminders</div>';
      if (!list.length) html += '<div class="empty">No reminders yet — add the first one above.</div>';
      list.forEach(function (r) {
        html += '<div class="mrow"><div class="row-main"><div class="row-title">' + esc(r.title) + '</div>' +
          '<div class="row-sub">' + scheduleText(r) + '</div></div>' + delBtn("reminder", r.id, r.title) + '</div>';
      });
    } else if (cg.seg === "routine") {
      if (!shared.routine.length) html += '<div class="empty">No routine yet — add ' + PATIENT.first + '’s first step above.</div>';
      PERIODS.forEach(function (p) {
        var items = shared.routine.filter(function (i) { return i.period === p.value; });
        if (!items.length) return;
        html += '<div class="section-title">' + p.label + '</div>';
        items.forEach(function (i) {
          html += '<div class="mrow" data-item="' + i.id + '"><div class="row-main"><div class="row-title">' + esc(i.title) + '</div>' +
            '<div class="row-sub">' + (i.time ? "around " + fmtTime(i.time) : "any time") + '</div></div>' +
            (i.done ? '<span class="status done">Done</span>' : '') + delBtn("routine", i.id, i.title) + '</div>';
        });
      });
    } else {
      if (!shared.vault.length) html += '<div class="empty">Nothing saved yet — add the first person or detail above.</div>';
      shared.vault.forEach(function (v) {
        var look = vaultLook(v);
        html += '<div class="mrow" data-item="' + v.id + '">' + tile(look) +
          '<div class="row-main"><div class="row-title">' + esc(v.title) + '</div>' +
          '<div class="row-sub">' + esc([look.label, v.sub].filter(Boolean).join(" · ")) + '</div></div>' +
          delBtn("vault", v.id, v.title) + '</div>';
      });
    }
    return html;
  }

  function summaryLine() {
    if (cg.seg === "reminders") {
      var tot = shared.reminders.length;
      return tot ? remindersDone() + " of " + tot + " reminders done today." : "No reminders scheduled today.";
    }
    if (cg.seg === "routine") return "Steps for " + PATIENT.first + "’s day — they check these off themselves.";
    return "People, doctors, and details " + PATIENT.first + " can look up any time.";
  }
  function addLabel() {
    if (cg.formOpen) return "Cancel";
    if (cg.seg === "reminders") return "Add reminder for " + PATIENT.first;
    if (cg.seg === "routine") return "Add a routine step for " + PATIENT.first;
    return "Add to " + PATIENT.first + "’s memory bank";
  }

  function renderManage() {
    topbar.innerHTML = '<button class="back" data-act="back" aria-label="Back to People">' + ICONS.chevL + '</button>' +
      '<div class="title">' + PATIENT.full + '</div>';
    var segs = [["reminders", "Reminders"], ["routine", "Routine"], ["vault", "Memory"]];
    screen.innerHTML =
      '<div class="seg" style="margin-top:6px">' + segs.map(function (s) {
        return '<button class="' + (cg.seg === s[0] ? "on" : "") + '" data-seg="' + s[0] + '" aria-pressed="' + (cg.seg === s[0]) + '">' + s[1] + '</button>';
      }).join("") + '</div>' +
      '<div class="summary-line" id="cg-summary">' + summaryLine() + '</div>' +
      '<button class="btn ' + (cg.formOpen ? "btn-snooze" : "btn-done") + ' btn-block" data-act="toggle-form">' + addLabel() + '</button>' +
      formHtml() +
      '<div id="cg-lists">' + listsHtml() + '</div>';
  }

  function saveForm() {
    var f = cg.form, id = newId();
    if (cg.seg === "reminders") {
      if (!f.title.trim()) return fail("Please give the reminder a name.");
      if (!fmtTime(f.time)) return fail("Please choose a time.");
      shared.reminders.push({ id: id, title: f.title.trim(), time: f.time, cat: f.cat, freq: f.freq, status: "open" });
      toast("Reminder added");
    } else if (cg.seg === "routine") {
      if (!f.title.trim()) return fail("Please name this step.");
      shared.routine.push({ id: id, period: f.period, title: f.title.trim(), time: f.stepTime, done: false });
      toast("Step added");
    } else {
      if (!f.name.trim()) return fail("Please give this a name.");
      shared.vault.push({ id: id, kind: f.kind, title: f.name.trim(), sub: f.desc.trim(), phone: f.phone.trim() });
      toast("Saved to memory bank");
    }
    cg.formOpen = false; cg.error = ""; cg.form = blankForm();
    publish(id);
    flashId = id;
    render(true);
  }
  function fail(msg) { cg.error = msg; render(true); }

  // ---- render dispatch ---------------------------------------------------
  function render(keepScroll) {
    var top = screen.scrollTop;
    pendingMood = null;
    if (ROLE === "caregiver") {
      topbar.hidden = false;
      if (cg.view === "manage") renderManage();
      else if (state.tab === "account") renderAccount();
      else renderPeople();
      tabbar.hidden = cg.view === "manage";
    } else if (state.tab === "summary") renderSummary();
    else if (state.tab === "reminders") renderReminders();
    else if (state.tab === "routine") renderRoutine();
    else if (state.tab === "vault") renderVault();
    else if (state.tab === "wellness") renderWellness();
    renderTabs();
    screen.scrollTop = keepScroll ? top : 0;
    showFlash();
  }

  // The other phone changed something. Redraw without disturbing a form
  // that is half filled in.
  function refresh() {
    if (ROLE === "caregiver" && cg.view === "manage") {
      document.getElementById("cg-summary").textContent = summaryLine();
      document.getElementById("cg-lists").innerHTML = listsHtml();
      showFlash();
    } else if (ROLE === "patient" && state.tab === "wellness" && pendingMood != null && shared.checkin == null) {
      flashId = null; // mid check-in, and nothing on this screen changed
    } else {
      render(true);
    }
  }

  function showFlash() {
    if (!flashId) return;
    var el = screen.querySelector('[data-item="' + flashId + '"]');
    flashId = null;
    if (!el) return;
    el.classList.add("flash");
    if (el.scrollIntoView) el.scrollIntoView({ block: "nearest" });
  }

  function renderTabs() {
    var current = ROLE === "caregiver" && state.tab !== "account" ? "people" : state.tab;
    tabbar.innerHTML = TABS.map(function (t) {
      return '<button class="tab' + (current === t.id ? " on" : "") + '" data-tab="' + t.id + '" aria-current="' + (current === t.id) + '">' +
        TAB_ICONS[t.id] + '<span class="label">' + t.label + '</span></button>';
    }).join("");
  }

  // ---- interactions ------------------------------------------------------
  function find(list, id) { return list.filter(function (r) { return r.id === id; })[0]; }
  function removeFrom(key, id) { shared[key] = shared[key].filter(function (r) { return r.id !== id; }); }

  function handleAct(act, el) {
    var id = el.getAttribute("data-id");
    if (act === "done") { var r = find(shared.reminders, id); if (r) { r.status = "done"; toast("Nice — marked done"); publish(id); render(true); } }
    else if (act === "snooze") { var s = find(shared.reminders, id); if (s) { s.status = "snoozed"; toast("Snoozed for 10 minutes"); publish(id); render(true); } }
    else if (act === "reopen") { var o = find(shared.reminders, id); if (o) { o.status = "open"; publish(id); render(true); } }
    else if (act === "toggle") { var it = find(shared.routine, id); if (it) { it.done = !it.done; publish(id); render(true); } }
    else if (act === "mood") {
      pendingMood = parseInt(el.getAttribute("data-mood"), 10);
      Array.prototype.forEach.call(document.querySelectorAll(".mood"), function (m) {
        m.classList.toggle("on", m === el);
      });
      var save = document.getElementById("save-checkin");
      if (save) { save.style.opacity = "1"; save.style.pointerEvents = "auto"; }
    }
    else if (act === "edit-checkin") { shared.checkin = null; publish(); render(); }
    // caregiver
    else if (act === "open-patient") { cg.view = "manage"; cg.seg = "reminders"; cg.formOpen = false; render(); }
    else if (act === "back") { cg.view = "people"; cg.formOpen = false; cg.error = ""; render(); }
    else if (act === "toggle-form") { cg.formOpen = !cg.formOpen; cg.error = ""; if (!cg.formOpen) cg.form = blankForm(); render(true); focusFirstField(); }
    else if (act === "save") { saveForm(); }
    else if (act === "connect") {
      var code = (document.getElementById("code").value || "").trim().toUpperCase();
      if (!code) return;
      cg.code = "";
      cg.codeMsg = "In the real app, this sends a request that they approve on their own phone. " + PATIENT.first + " is already connected in this preview.";
      render(true);
    }
    else if (act === "del-reminder") { removeFrom("reminders", id); toast("Reminder removed"); publish(); render(true); }
    else if (act === "del-routine") { removeFrom("routine", id); toast("Step removed"); publish(); render(true); }
    else if (act === "del-vault") { removeFrom("vault", id); toast("Removed from memory bank"); publish(); render(true); }
  }
  function focusFirstField() {
    var first = cg.formOpen && screen.querySelector(".input[data-field]");
    if (first) first.focus();
  }

  document.addEventListener("click", function (e) {
    var tab = e.target.closest("[data-tab]");
    if (tab) { state.tab = tab.getAttribute("data-tab"); cg.codeMsg = ""; render(); return; }

    var seg = e.target.closest("[data-seg]");
    if (seg) { cg.seg = seg.getAttribute("data-seg"); cg.formOpen = false; cg.error = ""; cg.form = blankForm(); render(); return; }

    var chip = e.target.closest("[data-chip]");
    if (chip) {
      var name = chip.getAttribute("data-chip");
      cg.form[name] = chip.getAttribute("data-value");
      Array.prototype.forEach.call(screen.querySelectorAll('[data-chip="' + name + '"]'), function (c) {
        c.classList.toggle("on", c === chip);
        c.setAttribute("aria-pressed", c === chip);
      });
      return;
    }

    var save = e.target.closest("#save-checkin");
    if (save && pendingMood != null) { shared.checkin = { mood: pendingMood }; toast("Saved. Have a lovely day!"); publish(); render(); return; }

    var toastBtn = e.target.closest("[data-toast]");
    if (toastBtn) { toast(toastBtn.getAttribute("data-toast")); return; }

    var actEl = e.target.closest("[data-act]");
    if (actEl) { handleAct(actEl.getAttribute("data-act"), actEl); }
  });

  document.addEventListener("input", function (e) {
    var name = e.target.getAttribute && e.target.getAttribute("data-field");
    if (name) cg.form[name] = e.target.value;
  });

  document.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("check-row")) {
      e.preventDefault();
      handleAct("toggle", e.target);
    } else if (e.key === "Enter" && e.target.getAttribute && e.target.getAttribute("data-field")) {
      e.preventDefault();
      saveForm();
    } else if (e.key === "Enter" && e.target.id === "code") {
      handleAct("connect", e.target);
    }
  });

  // ---- date helpers ------------------------------------------------------
  function greetingWord() {
    var h = new Date().getHours();
    if (h < 12) return "Good morning";
    if (h < 18) return "Good afternoon";
    return "Good evening";
  }
  function todayLabel() {
    var d = new Date();
    var days = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];
    var months = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
    return days[d.getDay()] + ", " + months[d.getMonth()] + " " + d.getDate();
  }
  function tickClock() {
    var d = new Date();
    var h = d.getHours() % 12; if (h === 0) h = 12;
    document.getElementById("clock").textContent = h + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  tickClock();
  setInterval(tickClock, 15000);

  if (ROLE === "caregiver") state.tab = "people";
  render();
})();
</script>
</body>
</html>
